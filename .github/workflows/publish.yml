name: Publish

on:
  push:
    tags: ['v*']

# Allow the workflow to create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  # Build a compressed, self-contained single-file executable per runtime.
  # Both RIDs cross-compile fine on Linux, so one runner handles the matrix.
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            ext: ''
          - rid: win-x64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Tests are the CI gate: main is branch-protected to require the
      # "Build & Test" check, so any commit you tag has already gone green.
      # PublishSingleFile bundles the managed assemblies; the two extra props
      # embed the native libs (libSkiaSharp, e_sqlite3) into the one file and
      # compress it (~150 MB -> ~75 MB). wwwroot ships as embedded resources,
      # so the single binary runs standalone.
      - name: Publish single-file (${{ matrix.rid }})
        run: >
          dotnet publish FunctionalBlog/FunctionalBlog.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          --output publish

      - name: Rename executable
        run: >
          mv "publish/FunctionalBlog${{ matrix.ext }}"
          "FunctionalBlog-${GITHUB_REF_NAME}-${{ matrix.rid }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunctionalBlog-${{ matrix.rid }}
          path: FunctionalBlog-${{ github.ref_name }}-${{ matrix.rid }}${{ matrix.ext }}
          if-no-files-found: error

  # Collect every artifact and cut a single release so the matrix jobs don't
  # race to create it.
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*
          --title "${GITHUB_REF_NAME}"
          --generate-notes
